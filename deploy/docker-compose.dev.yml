# 즉시 반영(dev) 오버레이 — 소스를 바인드마운트 + astro dev(HMR). 재빌드 없이 git pull 만으로 반영.
# 사용:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build web
#   # 이후 코드 수정 반영: tme 에서  git pull  → astro dev HMR 가 자동 반영(재빌드 X)
# 프로덕션(빌드)으로 돌아가기:
#   docker compose -f docker-compose.yml up -d --build web
#
# ★단일 사용자 프리런치 반복용. 공개 출시 땐 프로덕션(빌드) 모드로.

services:
  web:
    build:
      target: dev
    environment:
      NODE_ENV: development
      HOME: /root
    volumes:
      # ★레포 루트 전체를 바인드(.git 포함) — 콘텐츠 크론(widget_spec_loop 등)이 컨테이너 안에서
      #   git add/commit/push 하므로 .git 이 없으면 "not a git repository"로 실패한다.
      #   node_modules 만 named volume 으로 오버라이드(바인드에 안 가려지게, 호스트오염 방지).
      - ..:/app
      - ms_devnode:/app/web/node_modules
      # 튜터 구독 인증(dev 컨테이너는 root 실행 → /root/.claude).
      - ${MS_CLAUDE_DIR}:/root/.claude
      # 크론의 git push(SSH). 읽기전용 마운트(컨테이너가 키 변경 못 함).
      # ★gitconfig 는 안 옮긴다 — /app/.git 이 호스트와 *같은 바인드*(레포 루트 전체 마운트)라
      #   `git config user.*` 를 컨테이너 안에서 한 번 설정하면 .git/config 에 박혀 호스트와도 공유된다.
      #   (호스트에 ~/.gitconfig 파일이 원래 없었는데 이 키로 마운트 시도하면 Docker 가 빈 디렉터리로
      #   자동생성해 호스트를 오염시킨다 — 2026-07-01 발견·정리.)
      - ${HOME}/.ssh:/root/.ssh:ro
    # dev 서버는 헬스체크 워밍업이 길 수 있어 완화(빌드본 healthcheck 상속 무력화).
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s

volumes:
  ms_devnode:
