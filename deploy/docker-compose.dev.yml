# 즉시 반영(dev) 오버레이 — 소스를 바인드마운트 + astro dev(HMR). 재빌드 없이 git pull 만으로 반영.
# 사용:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build web
#   # 이후 코드 수정 반영: tme 에서  git pull  → astro dev HMR 가 자동 반영(재빌드 X)
# 프로덕션(빌드)으로 돌아가기:
#   docker compose -f docker-compose.yml up -d --build web
#
# ★단일 사용자 프리런치 반복용. 공개 출시 땐 프로덕션(빌드) 모드로.

services:
  web:
    build:
      target: dev
    environment:
      NODE_ENV: development
      HOME: /root
    volumes:
      # ★레포 루트 전체를 바인드(.git 포함) — 콘텐츠 크론(widget_spec_loop 등)이 컨테이너 안에서
      #   git add/commit/push 하므로 .git 이 없으면 "not a git repository"로 실패한다.
      #   node_modules 만 named volume 으로 오버라이드(바인드에 안 가려지게, 호스트오염 방지).
      - ..:/app
      - ms_devnode:/app/web/node_modules
      # ★.venv 도 named volume 으로 가려 준다. 안 그러면 레포 바인드가 이미지에 구워 둔
      #   /app/.venv 를 덮어 /api/sympy 가 'spawn /app/.venv/bin/python ENOENT' 로 죽는다.
      #   브라우저 Pyodide 가 1차라 평소엔 안 드러나지만, Pyodide 로딩이 실패하는 기기에서는
      #   이 폴백으로 넘어오고 그때 좌표 계산이 통째로 실패한다.
      - ms_devvenv:/app/.venv
      # 튜터 구독 인증(dev 컨테이너는 root 실행 → /root/.claude).
      - ${MS_CLAUDE_DIR}:/root/.claude
      # ★git push(SSH)는 컨테이너 안에서 안 한다 — 호스트 ~/.ssh 를 마운트하면 OpenSSH 가 파일
      #   소유자(host uid)와 마운트 후 읽는 유저(컨테이너 root)가 달라 "Bad owner or permissions"로
      #   거부한다(2026-07-01 발견). /app/.git 이 호스트와 *같은 바인드*(레포 루트 전체 마운트)이므로
      #   컨테이너의 `git commit`(로컬, 네트워크 불필요)은 그대로 호스트 .git 에 반영된다 — push 만
      #   크론 호출부에서 컨테이너 실행 *다음 단계*로 호스트에서 한다(이미 SSH 되는 호스트 자격 재사용).
      # ★gitconfig 도 안 옮긴다 — 위 이유로 컨테이너 안에서 `git config user.*` 한 번이면 같은
      #   .git/config 에 박혀 호스트와도 공유된다(호스트에 없던 ~/.gitconfig 를 마운트시도하면 Docker
      #   가 빈 디렉터리로 자동생성해 호스트를 오염시켰던 사고도 2026-07-01 정리함).
    # dev 서버는 헬스체크 워밍업이 길 수 있어 완화(빌드본 healthcheck 상속 무력화).
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s

volumes:
  ms_devnode:
  ms_devvenv:
