# math-study 자가호스팅(tme) — 부동산 포렌식과 한 박스 공존.
# mem_limit 로 리소스 격리(학습기가 포렌식을 굶기지 못하게). claude 구독 인증은 런타임 마운트.
#
# 사용:
#   cd deploy && cp .env.example .env && vi .env      # 시크릿 채우기(미커밋)
#   docker compose up -d --build                       # 빌드+기동
#   docker compose logs -f web                         # 로그
# 빌드 컨텍스트=레포 루트(web/Dockerfile 헤더 참고: prebuild 가 ../docs·db/raw 읽음).

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: mathstudy
      POSTGRES_USER: mathstudy
      POSTGRES_PASSWORD: ${MS_DB_PASSWORD}
    volumes:
      - ms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mathstudy -d mathstudy"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 4g
    # ★호스트에는 **127.0.0.1:5434 로만** 노출한다(외부 노출 아님). 포렌식 postgres(5432)와
    #   포트가 갈려 충돌하지 않는다. 인제스트 파이프라인이 호스트에서 돌면서 psycopg 로 직접
    #   붙어야 하는데, 미노출이면 아예 닿을 수 없다(2026-08-14 tme 실측: connection refused).
    ports:
      - "127.0.0.1:${MS_DB_PORT:-5434}:5432"
    dns: &dns [1.1.1.1, 8.8.8.8]
    # ★tme 호스트의 /etc/resolv.conf 는 Tailscale MagicDNS(100.100.100.100, tailscale0 전용)라
    #   Docker 브리지망 컨테이너에선 라우팅 불가 → 임베디드 DNS(127.0.0.11)가 외부 도메인 전부
    #   resolve 실패(api.anthropic.com 포함, 컨테이너간 서비스명만 됨). 공개 DNS 명시로 우회.

  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8080
      MATH_STUDY_DATABASE_URL: postgres://mathstudy:${MS_DB_PASSWORD}@db:5432/mathstudy
      MATH_STUDY_ADMIN_EMAILS: ${MS_ADMIN_EMAILS}
      # TLS 리버스 프록시 붙이기 전엔 false(http 로 쿠키 전달돼야 로그인됨). 붙이면 true 로.
      MATH_STUDY_SECURE_COOKIES: ${MS_SECURE_COOKIES:-false}
      # ★프롬프트 캐싱: clean cwd(컨테이너 /tmp 는 깨끗) + chat.ts 가 DISABLE_GIT 주입 → cache_read 유지.
      CLAUDE_P_CWD: /tmp/claude_p_clean
      # ★튜터 인증: 대화형 로그인이 만든 .credentials.json 은 조용히 만료된다(2026-08-12 claudeAiOauth
      #   블록이 사라져 튜터가 15시간 죽었고, /api/health 는 내내 200이라 아무도 몰랐다).
      #   `claude setup-token` 의 1년 장기 토큰을 env 로 고정한다. 없으면 기존 파일 인증으로 폴백.
      CLAUDE_CODE_OAUTH_TOKEN: ${MS_CLAUDE_OAUTH_TOKEN:-}
      # ★제품 튜터(외부 API) — **필수다. 미설정이면 튜터가 죽는다(503).**
      #   이 줄엔 "없으면 구독 haiku 로 폴백하므로 미설정도 안전" 이라고 적혀 있었는데
      #   **코드와 어긋난다**(chat.ts «폴백 없음» — 키가 없으면 503). 폴백은 장애를 숨겨
      #   발견을 늦추므로 의도적으로 뺀 것이다(8/12 에 15시간 늦었다).
      #   학생 트래픽은 **전부 이 경로**다 — 프런트가 model 을 안 보내 기본값 'tutor' 로
      #   고정되고, haiku/sonnet/opus 는 요청이 명시할 때만 쓰는 개발용이다.
      #   따라서 구독 쿼터는 튜터가 아니라 개발 세션·배치만 쓴다.
      NOUS_API_KEY: ${MS_NOUS_API_KEY:-}
      NOUS_TUTOR_MODEL: ${MS_TUTOR_MODEL:-openai/gpt-5.6-luna}
      HOME: /home/node
    volumes:
      # 튜터 claude -p 구독 인증·설정. rw: OAuth 토큰 갱신 위해(시크릿은 이미지에 안 구움).
      - ${MS_CLAUDE_DIR}:/home/node/.claude
    ports:
      # 초기 검증은 Tailscale 로 직접(0.0.0.0). 프로덕션은 리버스 프록시 뒤로 옮기고 127.0.0.1 로 제한.
      - "${MS_WEB_PORT:-4324}:8080"
    mem_limit: 6g
    dns: *dns

volumes:
  ms_pgdata:
