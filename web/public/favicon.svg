<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- 모바일 헤더 브랜드 인장과 통일: 종이 타일 위 빨간 작도 곡선(한 획) + 모눈 상자.
       데스크탑·모바일 탭 favicon 을 동일하게(앱 내 브랜드 마크와도 일치).
       색은 라이트 테마 토큰 값 하드코딩(파비콘엔 CSS 변수 사용 불가):
       bg #EFE3C9 · border #D7CDB5 · pen red #C13D38. -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="7" fill="#EFE3C9" stroke="#D7CDB5"/>
  <rect x="6" y="6" width="20" height="20" rx="3" fill="none" stroke="#C13D38" stroke-width="2"/>
