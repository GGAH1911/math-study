<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <filter id="grain">
    <!-- 옥타브 4 = 미세 알갱이 + 굵은 섬유/얼룩 동시. baseFrequency 낮춰 종이 결이 또렷하게. -->
    <feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="4" seed="11" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <!-- 명암 확대: [0,1]→[0.27,0.73] (±0.23 고대비) → overlay/soft-light 블렌드 시 결이 도드라짐. -->
    <feComponentTransfer>
      <feFuncR type="linear" slope="0.46" intercept="0.27"/>
      <feFuncG type="linear" slope="0.46" intercept="0.27"/>
      <feFuncB type="linear" slope="0.46" intercept="0.27"/>
    </feComponentTransfer>
  </filter>
  <rect width="300" height="300" filter="url(#grain)"/>
</svg>
